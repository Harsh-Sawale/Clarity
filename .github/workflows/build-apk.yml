name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK for release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./Clarity.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clarity-Android-APK
          path: ./Clarity.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Clarity v1.0.0 - Standalone Android APK
          body: |
            ### Clarity v1.0.0 Official Release

            Minimalist, sandboxed, 100% offline ephemeral camera for Android.

            #### How to Install on Your Phone:
            1. Download `Clarity.apk` below directly to your Android device.
            2. Tap the downloaded file to install (allow install from browser if prompted).
            3. Enjoy full private scratchpad photography with zero cloud sync!

            #### Built by:
            Harsh Sawale (@Harsh-Sawale)
          files: ./Clarity.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
