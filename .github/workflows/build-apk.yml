name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK for release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./Clarity.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clarity-Android-APK
          path: ./Clarity.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.2.0
          name: Clarity v1.2.0 - Standalone Android APK
          body: |
            ### Clarity v1.2.0 Official Release

            Chunky iOS-style liquid glass design, high-density list & grid viewing modes, multi-select batch photo manager, and customizable timers.

            #### What's New in v1.2.0:
            * **Chunky Liquid Glass UI:** Larger, more tactile buttons with iOS specular highlights and spring compression feedback.
            * **List & Grid Layouts:** Switch between compact list rows and visual 2-column image cards with one tap.
            * **Multi-Select Batch Management:** Select multiple or all photos at once to batch-extend (+2H), batch-keep, or batch-delete.
            * **28px Touch-Safe Checkboxes:** High-visibility circular checkboxes that are effortless to tap.
            * **Custom Lifespan Timers:** Set any photo expiration from 1 minute up to 7 full days (1 week).
            * **24-Hour Safety Net:** Expired photos wait in the 24-hour Trash before deletion.
            * **New Handcrafted Launch Screen:** Geometric lens aperture icon with creator attribution.

            #### How to Install:
            1. Download `Clarity.apk` below directly to your phone.
            2. Tap the file in notifications / downloads to install.
            3. Enjoy full offline, privacy-first scratch photography!

            #### Built by:
            Harsh Sawale (@Harsh-Sawale)
          files: ./Clarity.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
